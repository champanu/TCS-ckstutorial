apiVersion: v1
kind: Pod
metadata:
  name: pod-with-init-and-svc
  labels:
    app: init-nginx
spec:
  volumes:
  - name: workdir
    emptyDir: {}
  initContainers:
  - name: init-config
    image: busybox
    command: ['sh', '-c', 'echo "<h1>Hello from Init!</h1>" > /work-dir/index.html']
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  containers:
  - name: nginx
    image: nginx:1.25
    volumeMounts:
    - name: workdir
      mountPath: /usr/share/nginx/html
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: init-nginx-svc
spec:
  selector:
    app: init-nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP

