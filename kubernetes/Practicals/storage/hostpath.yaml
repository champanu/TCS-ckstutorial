apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
spec:
  volumes:
  - name: host-volume
    hostPath:
      path: /data/hostdir   # directory must exist on the Node
  containers:
  - name: app
    image: busybox
    command: ["sh", "-c", "echo NodeData >> /mnt/host/hello.txt && sleep 3600"]
    volumeMounts:
    - name: host-volume
      mountPath: /mnt/host
